name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.verify.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch the annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: wyrd-company/intentional@0.1.6
        with:
          command: check
          intentional-version: 0.1.6
      - name: Require an Intentional release record
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          refuse() { echo "::error::refusing to deploy ${tag}: $1"; exit 1; }

          [[ "$(git cat-file -t "refs/tags/${tag}")" == "tag" ]] || refuse "not an annotated tag"
          body="$(git cat-file -p "refs/tags/${tag}" | sed '1,/^$/d')"
          [[ "$(printf '%s\n' "$body" | head -n1)" == "intentional release record" ]] || refuse "not an Intentional release record"
          field() { printf '%s\n' "$body" | sed -n "s/^$1: //p" | head -n1; }

          [[ "$(field tag-id)" == "release-unit/caddy/primary" ]] || refuse "unexpected tag-id $(field tag-id)"
          [[ "$(field version)" == "$tag" ]] || refuse "record version $(field version) does not match the tag"
          case "$(field baseline)" in
            true)
              echo "::notice::${tag} is a baseline record; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            false) ;;
            *) refuse "record has no baseline field" ;;
          esac
          [[ -n "$(field plan-digest)" ]] || refuse "record has no plan digest"

          # The tagged commit must carry the applied release.
          grep -q "^## ${tag}\$" CHANGELOG.md || refuse "CHANGELOG.md has no ${tag} section"
          echo "release=true" >> "$GITHUB_OUTPUT"

  image:
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v h="## ${TAG}" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          # Backticks format the image name in Markdown.
          # shellcheck disable=SC2016
          printf '\nImage: `ghcr.io/%s:%s`\n' "${GITHUB_REPOSITORY,,}" "$TAG" >> release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --notes-file release-notes.md
